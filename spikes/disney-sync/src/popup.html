<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Disney+ sync</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; }
      #status { font-weight: 600; margin-bottom: 4px; }
      #sub, #hint { color: #666; margin-bottom: 10px; }
      #error { color: #b00020; min-height: 1em; margin-bottom: 6px; }
      .row { display: flex; gap: 6px; margin-bottom: 8px; }
      input { flex: 1; min-width: 0; padding: 5px; }
      button { padding: 5px 12px; }
      ol { margin: 0; padding-left: 0; list-style: none; font: 11px ui-monospace, monospace; }
      li { padding: 2px 0; border-bottom: 1px solid #eee; }
      .in { color: #0b6bcb; }
      .out { color: #1a7f37; }
    </style>
  </head>
  <body>
    <div id="status">…</div>
    <div id="sub"></div>
    <div class="row">
      <input id="room" placeholder="room" />
      <button id="join">Join</button>
    </div>
    <div id="error"></div>
    <div id="hint">Relay: <code>corepack pnpm relay</code> in spikes/disney-sync</div>
    <ol id="log"></ol>
    <script src="popup.js"></script>
  </body>
</html>
